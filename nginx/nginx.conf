upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8000;
}

# HTTP：健康检查保留明文；其余强制跳 HTTPS
server {
    listen 80;
    server_name openwindow.chat www.openwindow.chat _;

    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name openwindow.chat www.openwindow.chat;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    ssl_certificate     /etc/nginx/certs/openwindow.chat_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/openwindow.chat.key;

    # 浏览器记住只走 HTTPS（首次 https 访问后生效）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Frontend - serve Next.js for all routes
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control 'no-store, no-cache, must-revalidate' always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Backend API - proxy to FastAPI
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control 'no-store, no-cache, must-revalidate' always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
